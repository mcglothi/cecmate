esphome:
  name: tv-cec
  friendly_name: TV CEC Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional: set a static IP so DNS resolves reliably
  # manual_ip:
  #   static_ip: 192.168.1.100
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  ap:
    ssid: "TV-CEC Fallback"
    password: "fallback123"

captive_portal:
logger:
web_server:
  port: 80

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source: github://johnboiles/esphome-hdmi-cec
    components: [hdmi_cec]

hdmi_cec:
  pin: GPIO21
  address: 0x05       # Logical address: Audio System
  # Set physical_address based on which HDMI port this is plugged into:
  #   HDMI1 = 0x1000 | HDMI2 = 0x2000 | HDMI3 = 0x3000
  physical_address: 0x2000

button:
  - platform: template
    name: "TV Power On"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x00   # TV
          data: [0x04]        # Image View On (wake)
      - delay: 2s
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F   # Broadcast
          data: [0x86, 0x10, 0x00]  # Set Stream Path: HDMI1 (1.0.0.0)
          # For LG/Sony/Panasonic, try Active Source instead:
          # data: [0x82, 0x10, 0x00]

  - platform: template
    name: "TV Power Off"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F   # Broadcast
          data: [0x36]        # Standby

  - platform: template
    name: "Switch to HDMI1"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F
          data: [0x82, 0x10, 0x00]  # Active Source: 1.0.0.0

  - platform: template
    name: "Switch to HDMI2"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F
          data: [0x82, 0x20, 0x00]  # Active Source: 2.0.0.0

  - platform: template
    name: "Switch to HDMI3"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F
          data: [0x82, 0x30, 0x00]  # Active Source: 3.0.0.0
