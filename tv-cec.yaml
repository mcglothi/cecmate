esphome:
  name: tv-cec
  friendly_name: TV CEC Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.10.199.178
    gateway: 10.10.0.1
    subnet: 255.255.0.0
    dns1: 10.10.0.2
    dns2: 10.10.0.22
  ap:
    ssid: "TV-CEC Fallback"
    password: "fallback123"

captive_portal:
logger:
web_server:
  port: 80

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source: github://johnboiles/esphome-hdmi-cec
    components: [hdmi_cec]

hdmi_cec:
  pin: GPIO21
  address: 0x05       # Logical address: Audio System
  physical_address: 0x2000  # Physical address: 2.0.0.0 (connected to HDMI2)

button:
  - platform: template
    name: "TV Power On"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x00   # TV
          data: [0x04]        # Image View On (wakes Samsung Anynet+)
      - delay: 2s             # Samsung needs time to wake before accepting input switch
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F   # Broadcast
          data: [0x86, 0x10, 0x00]  # Set Stream Path: HDMI1 (1.0.0.0) — more reliable on Samsung than Active Source

  - platform: template
    name: "TV Power Off"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F   # Broadcast
          data: [0x36]        # Standby

  - platform: template
    name: "Switch to HDMI1"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F
          data: [0x82, 0x10, 0x00]  # Active Source: 1.0.0.0

  - platform: template
    name: "Switch to HDMI2"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F
          data: [0x82, 0x20, 0x00]  # Active Source: 2.0.0.0

  - platform: template
    name: "Switch to HDMI3"
    on_press:
      - hdmi_cec.send:
          source: 0x05
          destination: 0x0F
          data: [0x82, 0x30, 0x00]  # Active Source: 3.0.0.0
